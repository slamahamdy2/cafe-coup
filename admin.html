<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F3EADB">
<title>Cafe Coup — Admin</title>
<link rel="icon" href="images/logo-coup.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3EADB;--card:#FFF8EE;--ink:#3B2418;--muted:#8A5A3B;--line:rgba(59,36,24,.16);--ok:#3F7A3A;--bad:#B3412E;--ease:cubic-bezier(.2,.8,.2,1);
  /* ألوان حالات الطلب */
  --st-new:#E0861A;--st-new-bg:#FDEBD3;
  --st-served:#2F6FB0;--st-served-bg:#DCE9F6;
  --st-paid:#3F7A3A;--st-paid-bg:#DDEFD8;
  --st-cancelled:#8E8279;--st-cancelled-bg:#ECE6DF}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,sans-serif;font-weight:500;font-size:16px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--muted);outline-offset:2px}
.h{font-family:"Lalezar",sans-serif;font-weight:400}
[hidden]{display:none !important}
.wrap{max-width:760px;margin:0 auto;padding:max(14px, env(safe-area-inset-top)) 16px 120px}
.sub{margin:0;color:var(--muted);font-size:14px}

/* الأعلى */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top img{height:36px}
.top .actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 13px;font-size:14px;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px;line-height:1}
.lang{display:inline-flex;border:1px solid var(--ink);border-radius:999px;padding:3px;gap:2px;direction:ltr}
.lang button{border:0;background:none;border-radius:999px;padding:6px 11px 4px;font-family:"Lalezar",sans-serif;font-size:15px;line-height:1}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}

/* التبويبات الرئيسية */
.nav{display:grid;grid-template-columns:repeat(var(--tabs,4),1fr);gap:4px;margin:16px 0 14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:5px}
.nav button{border:0;background:none;border-radius:14px;padding:12px 4px 9px;font-family:"Lalezar",sans-serif;font-size:17px;line-height:1;position:relative}
@media (min-width:520px){ .nav button{font-size:19px} }
.role-badge{display:inline-block;font-size:12px;border-radius:999px;padding:3px 10px 1px;background:var(--st-served-bg);color:var(--st-served);font-weight:700;margin-top:6px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#FFF4DE;border:1.5px solid #E7B66A;border-radius:16px;padding:12px 14px;margin:0 0 12px;font-size:14px}
.banner b{font-family:"Lalezar",sans-serif;font-weight:400;font-size:17px;display:block}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:4px;font-size:14px;padding:6px}

/* ── الإحصائيات ── */
.periods{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:600px){ .kpis{grid-template-columns:repeat(3,1fr)} }
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.kpi span{display:block;font-size:13px;color:var(--muted)}
.kpi b{display:block;font-family:"Lalezar",sans-serif;font-weight:400;font-size:28px;line-height:1.15}
.kpi small{font-size:12px;color:var(--muted)}
.chart{margin-top:14px}
.chart h3{margin:0 0 2px;font-family:"Lalezar",sans-serif;font-weight:400;font-size:20px}
.chart .sub{margin-bottom:10px}
.cols{display:flex;align-items:flex-end;gap:2px;height:150px;padding-top:18px;border-bottom:1px solid var(--line);direction:ltr;overflow-x:auto}
.col{flex:1 1 0;min-width:8px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.col i{display:block;width:100%;max-width:34px;background:var(--muted);border-radius:4px 4px 0 0;min-height:2px}
.col.zero i{background:var(--line)}
.col:hover i,.col:focus i{background:var(--ink)}
.col em{position:absolute;bottom:calc(var(--h) + 2px);font-style:normal;font-size:11px;color:var(--ink);white-space:nowrap}
.xlabels{display:flex;gap:2px;direction:ltr;margin-top:4px}
.xlabels span{flex:1 1 0;min-width:8px;text-align:center;font-size:10px;color:var(--muted);overflow:hidden;white-space:nowrap}
.hbars{display:grid;gap:8px}
.hbar{display:grid;grid-template-columns:minmax(90px,30%) 1fr auto;gap:10px;align-items:center;font-size:14px}
.hbar .track{height:14px;background:rgba(59,36,24,.08);border-radius:4px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--muted);border-radius:4px}
.hbar b{font-weight:700;font-size:14px;min-width:70px;text-align:end}
.toptable{width:100%;border-collapse:collapse;font-size:14px}
.toptable th{font-weight:500;color:var(--muted);text-align:start;padding:6px 4px;border-bottom:1px solid var(--line)}
.toptable td{padding:8px 4px;border-bottom:1px dashed var(--line)}
.toptable td.n{font-weight:700;text-align:end;white-space:nowrap}
.toptable th.n{text-align:end}

/* ── الأمان ── */
.pwform{display:grid;gap:10px;margin-top:10px}
.pwform .rowf{margin-top:0}
.ok{color:var(--ok);font-size:14px;margin:0}
.state{display:inline-block;font-size:12px;border-radius:999px;padding:3px 10px 1px;font-weight:700}
.state.on{background:var(--st-paid-bg);color:var(--st-paid)} .state.off{background:var(--st-cancelled-bg);color:var(--st-cancelled)}
.modal{position:fixed;inset:0;z-index:80;background:rgba(30,14,6,.55);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--bg);border-radius:24px;padding:22px 20px;max-width:420px;width:100%;text-align:center;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.modal h2{margin:0 0 6px;font-size:24px}
.code{font-family:ui-monospace,Consolas,monospace;font-size:26px;letter-spacing:.08em;direction:ltr;background:#fff;border:2px dashed var(--ink);border-radius:14px;padding:14px 10px;margin:14px 0;user-select:all;font-weight:700}
.modal .warn{font-size:14px;color:var(--bad);line-height:1.6}
.modal label{display:flex;gap:8px;align-items:center;justify-content:center;margin:12px 0;font-size:15px}
.modal label input{width:20px;height:20px;accent-color:var(--ink)}
.modal .btns{display:grid;gap:8px}
.nav button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.nav .dot{position:absolute;top:-7px;inset-inline-end:-2px;min-width:20px;height:20px;border-radius:999px;background:var(--st-new);color:#fff;font-family:"Tajawal";font-size:12px;line-height:21px;padding:0 6px;box-shadow:0 0 0 2px var(--bg)}
h1{margin:4px 0 2px;font-size:28px}

/* الدخول */
.login{max-width:380px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 22px;text-align:center}
.login img{height:56px}
.login form{display:grid;gap:12px;margin-top:18px}
.field{display:grid;gap:6px;text-align:start}
.field label{font-size:14px;color:var(--muted)}
.input{width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px 14px;font-size:17px}
textarea.input{min-height:72px;resize:vertical;line-height:1.5}
.input:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px rgba(59,36,24,.12)}
.err{color:var(--bad);font-size:14px;min-height:1em;margin:0}
.btn{border:0;border-radius:999px;background:var(--ink);color:var(--bg);padding:14px 22px 12px;font-family:"Lalezar",sans-serif;font-size:19px;line-height:1}
.btn:disabled{opacity:.45}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--bad);border:1px solid rgba(179,65,46,.35)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}

/* ── الطلبات ── */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 10px;text-align:center}
.stat b{display:block;font-family:"Lalezar",sans-serif;font-weight:400;font-size:30px;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.stat.paid b{color:var(--st-paid)} .stat.unpaid b{color:var(--st-new)}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.f{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px 5px;font-size:14px;line-height:1;display:inline-flex;gap:6px;align-items:center}
.f i{width:10px;height:10px;border-radius:50%;display:inline-block}
.f[aria-pressed=true]{border-color:var(--ink);background:#fff;font-weight:700}
.orders{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.order{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;border-inline-start:7px solid var(--c);position:relative}
.order.fresh{animation:fresh 1.2s var(--ease)}
@keyframes fresh{0%{box-shadow:0 0 0 0 rgba(224,134,26,.6)}100%{box-shadow:0 0 0 14px rgba(224,134,26,0)}}
.o-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.o-no{font-family:"Lalezar",sans-serif;font-size:24px;line-height:1}
.o-table{font-family:"Lalezar",sans-serif;font-size:18px;border:1.5px solid var(--ink);border-radius:10px;padding:3px 9px 0;line-height:1.2}
.o-meta{font-size:13px;color:var(--muted);margin-inline-start:auto;direction:ltr}
.pill{font-size:13px;border-radius:999px;padding:4px 10px 2px;background:var(--bgc);color:var(--c);font-weight:700}
.o-lines{list-style:none;margin:8px 0 6px;padding:0;font-size:15px}
.o-lines li{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dashed var(--line)}
.o-lines li span:first-child b{font-family:"Lalezar",sans-serif;font-weight:400;font-size:17px;margin-inline-end:6px}
.o-total{display:flex;justify-content:space-between;align-items:baseline;font-family:"Lalezar",sans-serif;font-size:20px;margin-top:4px}
.o-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.sbtn{border:1.5px solid var(--c);color:var(--c);background:#fff;border-radius:999px;padding:8px 14px 6px;font-size:14px;font-weight:700;line-height:1}
.sbtn.on{background:var(--c);color:#fff}
.st-new{--c:var(--st-new);--bgc:var(--st-new-bg)}
.st-served{--c:var(--st-served);--bgc:var(--st-served-bg)}
.st-paid{--c:var(--st-paid);--bgc:var(--st-paid-bg)}
.st-cancelled{--c:var(--st-cancelled);--bgc:var(--st-cancelled-bg)}
.order.st-cancelled{opacity:.6}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.archive{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.arow{width:100%;display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-align:start}
.arow .d{font-family:"Lalezar",sans-serif;font-size:19px}
.arow .c{font-size:14px;color:var(--muted)}
.arow .t{font-family:"Lalezar",sans-serif;font-size:18px;color:var(--st-paid)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:2px 0 10px}

/* ── المنيو ── */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px;margin:8px 0 14px}
.tab{border:0;background:none;border-radius:999px;padding:11px 6px 8px;font-family:"Lalezar",sans-serif;font-size:18px;line-height:1}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg)}
.tab small{font-family:"Tajawal",sans-serif;font-size:12px;opacity:.7;margin-inline-start:4px}
.pass{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.pass label{flex:1;min-width:160px}
.pass .input{width:120px;text-align:center}
.add{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed rgba(59,36,24,.35);background:none;border-radius:18px;padding:16px;font-family:"Lalezar",sans-serif;font-size:20px;line-height:1}
.add svg{width:18px;height:18px;margin-top:-3px}
.list{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
.row{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 12px}
.row.off{opacity:.55}
.row .thumb{width:64px;height:64px;border-radius:12px;background:#F7EFE2;display:grid;place-items:center;overflow:hidden}
.row .thumb img{max-width:100%;max-height:100%;object-fit:contain}
.row .main{min-width:0;border:0;background:none;text-align:start;padding:0}
.row .n{font-family:"Lalezar",sans-serif;font-size:19px;line-height:1.2;display:block}
.row .fn{font-size:13px;color:var(--muted);display:block}
.row .p{font-size:15px;margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:12px;border-radius:999px;padding:2px 9px;background:rgba(179,65,46,.12);color:var(--bad)}
.move{display:grid;gap:4px}
.move button{width:34px;height:30px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center}
.move button:disabled{opacity:.3}
.move svg{width:14px;height:14px}

/* ── الإعدادات ── */
.settings{display:grid;gap:14px}
.settings .card h3{margin:0 0 4px;font-family:"Lalezar",sans-serif;font-weight:400;font-size:21px}
.settings .rowf{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.settings .rowf .input{flex:1;min-width:180px;direction:ltr;text-align:left}

/* نافذة التعديل */
.back{position:fixed;inset:0;background:rgba(30,14,6,.45);z-index:40;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.back.open{opacity:1;visibility:visible}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:640px;margin:0 auto;max-height:92vh;overflow:auto;background:var(--bg);
  border-radius:26px 26px 0 0;padding:10px 18px max(18px, env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .4s var(--ease);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 8px}
.sheet h2{margin:0 0 12px;font-size:26px}
.form{display:grid;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.photo{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center}
.photo .pv{width:110px;height:110px;border-radius:18px;background:#F7EFE2 repeating-conic-gradient(#efe4d2 0 25%, transparent 0 50%) 0 0/18px 18px;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
.photo .pv img{max-width:100%;max-height:100%;object-fit:contain}
.photo .hint{font-size:13px;color:var(--muted);margin:6px 0 0;line-height:1.5}
.filebtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);border-radius:999px;padding:10px 16px;background:#fff;font-size:15px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.switch input{width:22px;height:22px;accent-color:var(--ink)}
.bar{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:4px}
.ltr{direction:ltr}
html[dir=rtl] .ltr{text-align:left}

/* إشعار */
.toast{position:fixed;left:50%;bottom:max(18px, env(safe-area-inset-bottom));transform:translate(-50%,150%);z-index:60;
  background:var(--ink);color:var(--bg);border-radius:999px;padding:12px 20px 10px;font-size:15px;box-shadow:0 14px 30px -12px rgba(30,14,6,.6);
  transition:transform .4s var(--ease);max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0)}
.toast:not(.show){visibility:hidden;transition:transform .4s var(--ease), visibility 0s .4s}
.toast.bad{background:var(--bad)}
.busy{position:fixed;inset:0;z-index:70;background:rgba(243,234,219,.6);display:grid;place-items:center;font-family:"Lalezar",sans-serif;font-size:22px}
</style>
</head>
<body>

<!-- 1) الدخول -->
<section class="login" id="loginView" hidden>
  <img src="images/logo-coup.png" alt="Cafe Coup">
  <h1 class="h" data-t="loginTitle"></h1>
  <p class="sub" data-t="loginSub"></p>
  <form id="loginForm">
    <div class="field">
      <label for="pw" data-t="password"></label>
      <input class="input" id="pw" type="password" autocomplete="current-password" required>
    </div>
    <p class="err" id="loginErr" role="alert"></p>
    <button class="btn" type="submit" id="loginBtn" data-t="login"></button>
    <button class="linkbtn" type="button" id="forgotBtn" data-t="forgot"></button>
  </form>
  <!-- نسيت كلمة السر -->
  <form id="recoverForm" hidden>
    <p class="sub" data-t="recoverHelp" style="text-align:start;line-height:1.7"></p>
    <div class="field">
      <label for="rKey" data-t="recoverKey"></label>
      <input class="input" id="rKey" autocomplete="off" autocapitalize="characters" spellcheck="false" style="direction:ltr">
    </div>
    <div class="field">
      <label for="rNew" data-t="newOwnerPw"></label>
      <input class="input" id="rNew" type="password" autocomplete="new-password">
    </div>
    <div class="field">
      <label for="rNew2" data-t="confirmPw"></label>
      <input class="input" id="rNew2" type="password" autocomplete="new-password">
    </div>
    <p class="err" id="recoverErr" role="alert"></p>
    <button class="btn" type="submit" id="recoverBtn" data-t="resetPw"></button>
    <button class="linkbtn" type="button" id="backLogin" data-t="backLogin"></button>
  </form>
  <div class="lang" style="margin-top:16px" role="group" aria-label="Langue / اللغة">
    <button type="button" data-lang="ar">عربي</button><button type="button" data-lang="fr">FR</button>
  </div>
</section>

<!-- 2) اللوحة -->
<main class="wrap" id="appView" hidden>
  <div class="top">
    <img src="images/logo-coup.png" alt="Cafe Coup">
    <div class="actions">
      <div class="lang" role="group" aria-label="Langue / اللغة">
        <button type="button" data-lang="ar">عربي</button><button type="button" data-lang="fr">FR</button>
      </div>
      <a class="chip" href="./" target="_blank" rel="noopener" data-t="openMenu"></a>
      <button class="chip" type="button" id="logout" data-t="logout"></button>
    </div>
  </div>

  <span class="role-badge" id="roleBadge" data-t="staffBadge" hidden></span>
  <nav class="nav" role="tablist" id="nav">
    <button role="tab" data-view="orders"><span data-t="navOrders"></span><span class="dot" id="newDot" hidden></span></button>
    <button role="tab" data-view="stats" data-t="navStats" data-owner></button>
    <button role="tab" data-view="menu" data-t="navMenu" data-owner></button>
    <button role="tab" data-view="settings" data-t="navSettings" data-owner></button>
  </nav>

  <!-- تنبيه: رمز الاسترجاع لم يُحفظ بعد -->
  <div class="banner" id="recoveryBanner" hidden>
    <span><b data-t="bannerTitle"></b><span data-t="bannerSub"></span></span>
    <button class="btn" type="button" id="bannerBtn" data-t="createCode" style="padding:11px 16px 9px;font-size:16px"></button>
  </div>

  <!-- الطلبات -->
  <section id="ordersView">
    <div class="dayhead">
      <div>
        <h1 class="h" id="dayTitle"></h1>
        <p class="sub" id="dayDate"></p>
      </div>
      <button class="chip" type="button" id="archiveBtn" data-t="archive" data-owner></button>
    </div>
    <div class="stats" id="statsRow">
      <div class="stat"><b id="sCount">0</b><span data-t="statCount"></span></div>
      <div class="stat paid" data-owner><b id="sPaid">0</b><span data-t="statPaid"></span></div>

const STATUSES = ["new", "served", "paid", "cancelled"];
let orders = [], summary = null, orderDay = "", todayDay = "", filter = "all", knownIds = null, ordersErr = "";
async function loadOrders(silent){
  try {
    const r = await api(`api/orders${orderDay && orderDay !== todayDay ? "?day=" + orderDay : ""}`);
    if (r.status === 401) return sessionExpired();
    const d = await r.json();
    if (!r.ok){ ordersErr = String(d.detail || "").includes("not-configured") ? t("ordersDbMissing") : t("loadFail"); renderOrders(); return; }
    ordersErr = "";
    todayDay = d.today; orderDay = d.day;
    // تنبيه عند وصول طلب جديد
    const ids = new Set(d.orders.map(o => o.id));
    const fresh = knownIds && d.day === todayDay ? d.orders.filter(o => !knownIds.has(o.id)) : [];
    knownIds = d.day === todayDay ? ids : knownIds;
    orders = d.orders; summary = d.summary;
    renderOrders(fresh.map(o => o.id));
    if (fresh.length){ toast(t("newOrder", fresh[0].no)); beep(); }
  } catch { if (!silent) toast(t("loadFail"), true); }
}
function beep(){
  try { const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination); o.frequency.value = 880; g.gain.setValueAtTime(.15, a.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, a.currentTime + .5); o.start(); o.stop(a.currentTime + .5); } catch {}
}
function renderOrders(freshIds = []){

    .concat(STATUSES.map(st => `<button class="f st-${st}" data-f="${st}" aria-pressed="${filter === st}"><i style="background:var(--c)"></i>${t("st_" + st)} · ${s.byStatus[st] || 0}</button>`)).join("");
  const shown = orders.filter(o => filter === "all" || o.status === filter);
  if (ordersErr){ $("orders").innerHTML = `<li class="empty">${esc(ordersErr)}</li>`; return; }
  $("orders").innerHTML = shown.length ? shown.map(o => {
    const actions = [
      o.status !== "served" && o.status !== "paid" && o.status !== "cancelled" ? ["served", t("markServed")] : null,
      o.status !== "paid" && o.status !== "cancelled" ? ["paid", t("markPaid")] : null,

    ].filter(Boolean);
    return `<li class="order st-${o.status} ${freshIds.includes(o.id) ? "fresh" : ""}">
      <div class="o-top">
        <span class="o-no">#${o.no}</span>
        <span class="o-table">${t("table")} ${esc(o.table)}</span>
        <span class="pill">${t("st_" + o.status)}</span>
        <span class="o-meta">${esc(fmtDate(o.at, { hour: "2-digit", minute: "2-digit" }))} · ${t("code")} ${esc(o.code)}</span>
      </div>
      <ul class="o-lines">${o.lines.map(l => `<li><span><b>${l.q}×</b>${esc(nameOf(l))}</span><span>${l.q * l.price}</span></li>`).join("")}</ul>
      <div class="o-total"><span>${t("total")}</span><span>${o.total} MRU</span></div>
      <div class="o-actions">${actions.map(([st, label]) => `<button class="sbtn st-${st}" type="button" data-set="${st}" data-id="${esc(o.id)}">${label}</button>`).join("")}</div>
    </li>`;
  }).join("") : `<li class="empty">${t("noOrders")}</li>`;
}

async function shrink(file){
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 900 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  const webp = await new Promise(r => c.toBlob(r, "image/webp", 0.9));
  if (webp && webp.type === "image/webp") return webp;
  return new Promise(r => c.toBlob(r, "image/png"));
}

  const f = $("file").files[0]; if (!f) return;
  try { pendingImage = await shrink(f); } catch { pendingImage = f; }

  $("fileLabel").textContent = t("changePhoto");
  $("file").value = "";
});
const slug = s => (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40);
function newId(name){ const base = slug(name) || "item"; let id = base, n = 2; while (menu.items.some(i => i.id === id)) id = `${base}-${n++}`; return id; }

$("itemForm").addEventListener("submit", async e => {
  e.preventDefault();
  const sec = $("fSection").value, nameAr = $("fNameAr").value.trim(), nameFr = $("fNameFr").value.trim(), priceRaw = $("fPrice").value;
  if (!nameAr){ $("formErr").textContent = t("needName"); $("fNameAr").focus(); return; }
  if (sec !== "games" && (priceRaw === "" || !(+priceRaw >= 0))){ $("formErr").textContent = t("needPrice"); $("fPrice").focus(); return; }
  if (editing === null && !pendingImage){ $("formErr").textContent = t("needPhoto"); return; }
  $("formErr").textContent = "";
  const before = JSON.parse(JSON.stringify(menu));
  $("busy").hidden = false;
  try {
    let image = editing === null ? "" : menu.items[editing].image;
    if (pendingImage){
      const r = await api("api/upload", { method: "POST", headers: { "content-type": pendingImage.type || "image/png" }, body: pendingImage });
      if (r.status === 401) return sessionExpired();
      if (!r.ok) throw new Error("upload");
      image = (await r.json()).url;
    }
    const it = { ...(editing === null ? { id: newId(nameFr || nameAr) } : menu.items[editing]),
      section: sec, name_ar: nameAr, name_fr: nameFr, desc_ar: $("fDescAr").value.trim(), desc_fr: $("fDescFr").value.trim(), image };
    if (sec === "games") delete it.price; else it.price = Math.round(+priceRaw);
    if ($("fShown").checked) delete it.hidden; else it.hidden = true;
    if (editing === null) menu.items.push(it);
    else if (menu.items[editing].section !== sec){ menu.items.splice(editing, 1); menu.items.push(it); }
    else menu.items[editing] = it;
    const ok = await save(editing === null ? t("added") : t("edited"), true);
    if (!ok){ menu = before; renderMenu(); return; }
    section = sec; closeEditor(); renderMenu();
  } catch { menu = before; renderMenu(); toast(t("notSaved"), true); }
  finally { $("busy").hidden = true; }
});
$("deleteBtn").addEventListener("click", async () => {
  if (editing === null) return;
  if (!confirm(t("confirmDelete", nameOf(menu.items[editing])))) return;
  const before = JSON.parse(JSON.stringify(menu));
  menu.items.splice(editing, 1);
  if (await save(t("deleted"))){ closeEditor(); renderMenu(); } else { menu = before; renderMenu(); }
});

/* الحفظ: يُرسل المنيو كاملاً مع الإعدادات */
async function save(okMsg, quiet){
  if (!quiet) $("busy").hidden = false;
  try {
    const r = await api("api/save", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(menu) });
    if (r.status === 401){ sessionExpired(); return false; }
    if (!r.ok) throw 0;
    savedAt = (await r.json()).savedAt; isOriginal = false; renderStatus();
    toast(okMsg); return true;
  } catch { toast(t("notSaved"), true); return false; }
  finally { if (!quiet) $("busy").hidden = true; }
}

/* ═══════════ الإحصائيات (المالك) ═══════════ */
let period = "7", stats = null;
async function loadStats(){
  try {
    const r = await api(`api/stats?period=${period}`);
    if (r.status === 401) return sessionExpired();
    if (!r.ok) throw 0;
    stats = await r.json(); renderStats();
  } catch { toast(t("loadFail"), true); }
}
$("periods").addEventListener("click", e => { const b = e.target.closest("[data-p]"); if (b){ period = b.dataset.p; loadStats(); renderStats(); } });
const shortDay = d => `${+d.slice(8, 10)}/${+d.slice(5, 7)}`; // 13/10
function columns(el, xEl, data, labelOf, valueOf, titleOf, showValue){
  const max = Math.max(1, ...data.map(valueOf));
  el.innerHTML = data.map(d => {
    const v = valueOf(d), h = Math.round((v / max) * 100);
    return `<div class="col ${v ? "" : "zero"}" tabindex="0" title="${esc(titleOf(d))}" style="--h:${h}%">
      ${showValue && v ? `<em>${v}</em>` : ""}<i style="height:${Math.max(h, 1)}%"></i></div>`;
  }).join("");
  el.setAttribute("aria-label", data.map(titleOf).join(" · "));
  xEl.innerHTML = data.map(labelOf).map(x => `<span>${esc(x)}</span>`).join("");
}
function renderStats(){
  document.querySelectorAll("#periods [data-p]").forEach(b => b.setAttribute("aria-pressed", b.dataset.p === period));
  if (!stats) return;
  const k = stats.totals;
  $("statsRange").textContent = t("range", fmtDate(stats.from + "T12:00:00Z", { day: "numeric", month: "long" }), fmtDate(stats.to + "T12:00:00Z", { day: "numeric", month: "long", year: "numeric" }));
  $("kSales").textContent = k.sales; $("kPaid").textContent = k.paid; $("kUnpaid").textContent = k.unpaid;
  $("kOrders").textContent = k.orders; $("kAvg").textContent = k.average;
  $("kCancelled").textContent = k.cancelled; $("kCancelledV").textContent = k.cancelled ? t("cancelledV", k.cancelledValue) : "";
  // المبيعات اليومية (يُخفى ليوم واحد)
  $("dailyCard").hidden = stats.daily.length < 2;
  const many = stats.daily.length > 12;
  columns($("dailyCols"), $("dailyX"), stats.daily,
    (d, i) => (!many || i % 5 === 0 || i === stats.daily.length - 1) ? shortDay(d.day) : "",
    d => d.sales, d => `${shortDay(d.day)}: ${d.sales} MRU · ${d.orders} ${t("kOrders")}`, !many);
  // حسب القسم
  const secs = [["drinks", t("secDrinks")], ["food", t("secFood")], ["games", t("secGames")], ["other", t("other")]].filter(([s]) => s !== "other" || stats.sections.other);
  const smax = Math.max(1, ...secs.map(([s]) => stats.sections[s]));
  $("sectionBars").innerHTML = secs.map(([s, label]) => `<div class="hbar"><span>${esc(label)}</span>
    <span class="track"><i style="width:${Math.round(stats.sections[s] / smax * 100)}%"></i></span><b>${stats.sections[s]}</b></div>`).join("");
  // الأكثر مبيعاً
  $("topBody").innerHTML = stats.top.length ? stats.top.map((it, i) => `<tr><td>${i + 1}</td><td>${esc(nameOf(it))}</td><td class="n">${it.q}</td><td class="n">${it.sales}</td></tr>`).join("")
    : `<tr><td colspan="4" class="empty">${t("noSales")}</td></tr>`;
  // أوقات الذروة: من 8 صباحاً حتى 2 بعد منتصف الليل، أو كل الساعات التي فيها طلبات
  const hrs = [...Array(24).keys()].filter(h => (h >= 8 || h <= 1) || stats.hours[h]).sort((a, b) => ((a + 16) % 24) - ((b + 16) % 24));
  const hd = hrs.map(h => ({ h, n: stats.hours[h] }));
  columns($("hourCols"), $("hourX"), hd, d => (d.h % 3 === 0 ? `${d.h}h` : ""), d => d.n, d => `${String(d.h).padStart(2, "0")}:00 — ${d.n}`, true);
}

/* ═══════════ الإعدادات: الأمان ═══════════ */
function renderSecurity(){
  $("staffState").className = "state " + (security.staffEnabled ? "on" : "off");
  $("staffState").textContent = security.staffEnabled ? t("staffOn") : t("staffOff");
  $("staffDisable").hidden = !security.staffEnabled;
  $("recoveryState").className = "state " + (security.hasRecovery ? "on" : "off");
  $("recoveryState").textContent = security.hasRecovery ? t("recoveryOn") : t("recoveryOff");
}
async function account(body){
  const r = await api("api/account", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  if (r.status === 401 && body.action !== "owner-password"){ sessionExpired(); return { ok: false }; }
  return { ok: r.ok, status: r.status, ...(await r.json().catch(() => ({}))) };
}
$("ownerPwForm").addEventListener("submit", async e => {
  e.preventDefault(); const err = $("opErr"); err.textContent = "";
  if ($("opNew").value.length < 6) return err.textContent = t("weakPw");
  if ($("opNew").value !== $("opNew2").value) return err.textContent = t("pwMismatch");
  const d = await account({ action: "owner-password", current: $("opCurrent").value, next: $("opNew").value });
  if (d.ok){ $("opCurrent").value = $("opNew").value = $("opNew2").value = ""; toast(t("ownerPwSaved")); }
  else err.textContent = d.error === "wrong-current" ? t("wrongCurrent") : d.error === "same-as-staff" ? t("sameAsStaff") : d.error === "weak-password" ? t("weakPw") : t("notSaved");
});
$("staffPwForm").addEventListener("submit", async e => {
  e.preventDefault(); const err = $("spErr"); err.textContent = "";
  if ($("spNew").value.length < 6) return err.textContent = t("weakPw");
  if ($("spNew").value !== $("spNew2").value) return err.textContent = t("pwMismatch");
  const d = await account({ action: "staff-password", next: $("spNew").value });
  if (d.ok){ $("spNew").value = $("spNew2").value = ""; security.staffEnabled = true; renderSecurity(); toast(t("staffSaved")); }
  else err.textContent = d.error === "same-as-owner" ? t("sameAsOwner") : d.error === "weak-password" ? t("weakPw") : t("notSaved");
});
$("staffDisable").addEventListener("click", async () => {
  if (!confirm(t("confirmDisable"))) return;
  const d = await account({ action: "staff-disable" });
  if (d.ok){ security.staffEnabled = false; renderSecurity(); toast(t("staffDisabled")); } else toast(t("notSaved"), true);
});
async function createCode(){
  if (security.hasRecovery && !confirm(t("confirmNewCode"))) return;
  const d = await account({ action: "recovery-code" });
  if (d.ok && d.recoveryCode) showCode(d.recoveryCode); else toast(t("notSaved"), true);
}
$("newCodeBtn").addEventListener("click", createCode);
$("bannerBtn").addEventListener("click", createCode);

/* نافذة رمز الاسترجاع: لا تُغلق قبل تأكيد الحفظ */
function showCode(code){
  if (!code) return;
  $("codeText").textContent = code; $("codeSaved").checked = false; $("codeDone").disabled = true;
  $("codeModal").hidden = false;
  security.hasRecovery = true; renderSecurity(); $("recoveryBanner").hidden = true;
}
$("codeSaved").addEventListener("change", () => { $("codeDone").disabled = !$("codeSaved").checked; });
$("codeCopy").addEventListener("click", async () => { try { await navigator.clipboard.writeText($("codeText").textContent); toast(t("copied")); } catch {} });
$("codeDone").addEventListener("click", () => { $("codeModal").hidden = true; $("codeText").textContent = ""; });

/* ═══════════ الإعدادات: رقم واتساب ═══════════ */
$("waSave").addEventListener("click", async () => {
  const v = $("waInput").value.replace(/\D/g, "");
  if (!/^\d{8,15}$/.test(v)){ $("waErr").textContent = t("waBad"); $("waInput").focus(); return; }
  $("waErr").textContent = "";
  const before = menu.whatsapp; menu.whatsapp = v;
  if (await save(t("waSaved"))) $("waInput").value = v; else menu.whatsapp = before;
});

applyLang();
start();
</script>
